name: 'Determine version from tag'
description: >-
  Strips the leading "v" so a tag (e.g. v0.1.0) becomes the app's version -
  this is what gets embedded via --build-name in Flutter builds.
inputs:
  tag:
    description: >-
      The tag name to derive the version from. Callers triggered by a tag
      push can pass github.ref_name; callers triggered by a release event
      (where the tag may not exist as a ref yet, e.g. an unpublished draft)
      must pass github.event.release.tag_name instead.
    required: true
outputs:
  name:
    description: 'The tag with its leading "v" stripped, e.g. 0.1.0'
    value: ${{ steps.version.outputs.name }}
runs:
  using: 'composite'
  steps:
    - id: version
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
